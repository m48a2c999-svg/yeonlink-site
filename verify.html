<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>본인인증 · 연링크</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
:root{--bg:#F6F5F2;--paper:#FFFFFF;--ink:#202026;--muted:#5E5A66;--line:#E3E0E8;--accent:#5C478B;--accent-soft:#ECE6F8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
h1{font-size:22px;margin:0 0 10px}
p{margin:0 0 14px;line-height:1.6;color:var(--muted);font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.5}
.small{font-size:13px}
.err{color:#A3263B}
</style>
</head>
<body>
<main class="card">
  <h1>휴대폰 본인인증</h1>
  <p>안전한 만남을 위해 통신사 본인인증(PASS 등)으로<br>만 19세 이상인지, 한 사람이 한 계정만 쓰는지 확인해요.</p>
  <p class="small">이름과 전화번호는 연링크에 저장하지 않아요. 생년월일·성별과 중복 확인용 값만 보관해요.</p>
  <button class="btn" id="go" type="button" disabled>본인인증 시작</button>
  <p class="small err" id="msg" role="alert"></p>
</main>
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search);
  var iv=q.get('iv')||'', store=q.get('store')||'', ch=q.get('ch')||'';
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  function fail(t){msg.textContent=t;go.disabled=true}
  if(!/^yl-iv-[0-9a-f]{32}$/.test(iv)||!/^store-[0-9a-f-]{36}$/.test(store)||!/^channel-key-[0-9a-f-]{36}$/.test(ch)){fail('잘못된 접근이에요. 앱에서 다시 시작해 주세요.');return}
  var done='https://yeonlink.com/verify-done.html';
  function start(){
    if(!window.PortOne||!PortOne.requestIdentityVerification){fail('인증 창을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');return}
    go.disabled=true; msg.textContent='';
    /* 다날 전용 값(bypass). 다날이 아닌 채널에서는 무시된다.
       AGELIMIT: 만 19세 미만은 인증 창 단계에서 막힌다(서버에서도 한 번 더 막음).
       CPTITLE: 인증 창에 보이는 서비스 이름. 비워 두면 '포트원'으로 표시된다. */
    PortOne.requestIdentityVerification({storeId:store,identityVerificationId:iv,channelKey:ch,
      redirectUrl:done,forceRedirect:true,
      bypass:{danal:{AGELIMIT:19,CPTITLE:'연링크 (yeonlink.com)'}}})
      .then(function(r){ /* 대부분 리디렉션되지만, 그렇지 않은 환경(PC 팝업)도 같은 완료 페이지로 */
        var u=done+'?identityVerificationId='+encodeURIComponent(iv); if(r&&r.code)u+='&code='+encodeURIComponent(r.code); location.replace(u)})
      .catch(function(){go.disabled=false;msg.textContent='인증 창을 열지 못했어요. 다시 눌러 주세요.'});
  }
  go.disabled=false; go.addEventListener('click',start);
  start();
})();
</script>
</body>
</html>
