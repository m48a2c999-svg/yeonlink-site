<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>본인인증 완료 · 연링크</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
:root{--bg:#F6F5F2;--paper:#FFFFFF;--ink:#202026;--muted:#5E5A66;--line:#E3E0E8;--accent:#5C478B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
h1{font-size:22px;margin:0 0 10px}
p{margin:0 0 14px;line-height:1.6;color:var(--muted);font-size:15px}
.btn{display:block;width:100%;border-radius:16px;padding:15px 16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-decoration:none}
.small{font-size:13px}
</style>
</head>
<body>
<main class="card">
  <h1 id="t">본인인증을 마쳤어요</h1>
  <p id="d">앱으로 돌아가면 결과를 확인해요.</p>
  <a class="btn" id="back" href="yeonlink://verified">연링크로 돌아가기</a>
  <p class="small">돌아가기가 열리지 않으면 이 창을 닫고 앱으로 돌아가 주세요.</p>
</main>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search);
  var iv=q.get('identityVerificationId')||'', code=q.get('code');
  if(!/^yl-iv-[0-9a-f]{32}$/.test(iv))iv='';
  if(code){document.getElementById('t').textContent='본인인증을 마치지 못했어요';document.getElementById('d').textContent='앱으로 돌아가 다시 시도해 주세요.'}
  var link='yeonlink://verified'+(iv?'?iv='+iv:'')+(code?(iv?'&':'?')+'fail=1':'');
  document.getElementById('back').href=link;
  setTimeout(function(){location.href=link},400);
})();
</script>
</body>
</html>
